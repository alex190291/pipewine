# PipeWine ASIO Driver Configuration
# This file configures the PipeWire ASIO driver for Windows applications running under Wine.
#
# Configuration priority (highest to lowest):
# 1. Environment variables (PIPEWIREASIO_*)
# 2. User config (~/.config/pipewine/pipewine.conf)
# 3. System config (/etc/pipewine/pipewine.conf)
# 4. Built-in defaults

[audio]
# Sample rate in Hz. Common values: 44100, 48000, 96000, 192000
sample_rate = 48000

# Buffer size in samples. Must be a power of 2 between 16 and 8192.
# Lower = less latency but more CPU usage and potential for glitches.
# Recommended: 256 (5.3ms @ 48kHz) for low latency, 1024 (21.3ms @ 48kHz) for stability.
buffer_size = 1024

# Number of input channels (1-64)
input_channels = 2

# Number of output channels (1-64)
output_channels = 2

[devices]
# Device names (leave empty to use system defaults)
# Use `pw-cli list-objects Node` to see available devices
input_device =
output_device =

# Automatically connect to hardware devices
auto_connect = true

[performance]
# Real-time thread priority (0 = disabled, 1-99 = priority level)
# Requires appropriate permissions (rtkit or /etc/security/limits.conf)
rt_priority = 50

# Request exclusive access to audio device (may prevent other apps from using audio)
exclusive_mode = false

[advanced]
# Custom client name (shown in PipeWire/JACK tools)
client_name =

# Enable debug logging (true/false)
debug_logging = false

# Log verbosity: 0=Error, 1=Warning, 2=Info, 3=Debug, 4=Trace
log_level = 1
